# Alembic конфигурация RemindMe.
#
# `sqlalchemy.url` намеренно пуст — URL базы данных разрешается в `alembic/env.py`
# из настроек приложения (`get_settings().DATABASE_URL`), чтобы не хранить путь/секрет
# в этом файле. Схема применяется одной начальной ревизией (см. `alembic/versions/`).

[alembic]
# Путь к каталогу миграций (от корня проекта).
script_location = alembic
# Корень проекта в sys.path, чтобы `from remindme...` разрешался в env.py.
prepend_sys_path = .
# Переопределяется в env.py из get_settings().DATABASE_URL.
sqlalchemy.url =

# Шаблон пути новых файлов ревизий (год/месяц префикс для сортировки).
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s


[post_write_hooks]
# Хуки запускаются после генерации новой ревизии alembic.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
